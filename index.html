<style>
:root{--ink:#193b3a;--teal:#12685f;--mint:#e1f2e9;--line:#d3dfd9;--light:#f4f7f3;--sub:#516c68;font:16px/1.6 "DM Sans","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);background:var(--light)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,.upload{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:7px 13px;background:#fff;color:var(--ink);font-weight:600}button:hover,.upload:hover{border-color:var(--teal);background:#edf5f1}button:disabled{cursor:default;opacity:.48}button:focus-visible,:focus-visible{outline:3px solid #dc9d43;outline-offset:2px}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#0c524b}.plain{background:transparent;border:0;color:var(--teal)}header{background:#fff;border-bottom:1px solid var(--line)}.bar,main{width:min(1240px,94%);margin:auto}.bar{min-height:68px;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{display:grid;place-items:center;width:37px;height:37px;background:var(--teal);border-radius:10px;color:white}.logo svg{width:23px;height:23px}.bar .right{margin-left:auto}.right,.row,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}main{padding:30px 0 48px}.hero{border-radius:16px;background:#104f4b;color:white;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;min-height:132px;overflow:hidden}.hero h1{font-size:clamp(1.65rem,4vw,2.45rem);letter-spacing:.045em;margin:0;font-family:"Songti TC","PMingLiU",serif}.hero p{color:#cee5dd;margin:6px 0 0}.art{width:170px;height:98px;flex:none}.grid{margin-top:20px;display:grid;grid-template-columns:245px minmax(0,1fr) minmax(270px,.71fr);gap:16px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:13px;min-width:0;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:16px 18px;border-bottom:1px solid var(--line)}h2,h3,p{margin:0}h2{font-size:1.14rem}h3,.label{font-weight:750;font-size:.99rem}.panelbody{padding:18px}.minor,small{font-size:.87rem;color:var(--sub)}.minor{line-height:1.55}.count{color:var(--teal);font:600 .83rem/1.7 monospace;background:var(--mint);padding:1px 8px;border-radius:20px}#list{display:grid;gap:5px;padding:10px;max-height:52vh;overflow:auto}.student{width:100%;justify-content:flex-start;border:1px solid transparent;text-align:left;min-height:44px}.student[aria-current=true]{background:var(--mint);border-color:#b6d9cd;color:#07564b}.seat{font:600 .85rem/1.4 monospace;color:var(--sub)}.check{color:var(--teal);margin-left:auto}.side-actions{display:grid;gap:9px;padding:14px;border-top:1px solid var(--line)}.section+.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 12px}.chip{font-size:.9rem;padding:4px 11px;border-radius:20px;font-weight:500}.chip[aria-pressed=true]{border-color:var(--teal);background:var(--mint);color:#084e46}.field{display:grid;gap:7px}.field+.field{margin-top:14px}input,textarea,select{width:100%;padding:9px 11px;border:1px solid #bccfc7;border-radius:7px;color:var(--ink);background:white}textarea{resize:vertical;line-height:1.65}::placeholder{color:#71837d}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twocol label{display:grid;gap:6px}.full{width:100%}details{padding:10px 0}summary{cursor:pointer;color:var(--teal);font-weight:600}blockquote{margin:8px 0;padding:5px 12px;border-left:3px solid #bcd5c9;color:var(--sub)}.output{background:#fbfcf8;border:1px solid #d3daca;min-height:230px}.actions{margin-top:10px}.notice{padding:0 4px;margin-top:12px;color:var(--teal);font-weight:650}.notice:empty{display:none}.error{color:#9f3529}dialog{border:1px solid var(--line);border-radius:15px;color:var(--ink);padding:0;width:min(580px,94vw);max-height:88vh}dialog::backdrop{background:#132d2c70}dialog .panelbody{display:grid;gap:14px}.upload{position:relative}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload:focus-within{outline:3px solid #dc9d43}#stop{margin-top:8px}.bar button{font-size:.9rem}button[hidden]{display:none}@media(max-width:1040px){.grid{grid-template-columns:205px 1fr}.result{grid-column:2}.people{grid-row:span 2}}@media(max-width:700px){.bar,main{width:94%}.bar{gap:5px}.right{gap:4px}.bar button{padding:6px}.brand{gap:6px}.brand span:last-child{display:none}main{padding-top:14px}.hero{padding:20px}.hero p{font-size:.9rem}.art{width:72px}.grid{grid-template-columns:1fr;gap:12px}.people,.result{grid-column:auto;grid-row:auto}#list{display:flex;overflow:auto}.student{width:auto;white-space:nowrap}.side-actions{display:flex;flex-wrap:wrap}.panelbody{padding:15px}}
main{width:min(1450px,96%)}.grid{grid-template-columns:minmax(180px,210px) minmax(0,1fr)}.people{grid-row:span 2}.result{grid-column:2}.output{min-height:145px}.categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 18px}.category{background:#f4f7f4;border-radius:9px;padding:10px}.category h3{font-size:1rem;margin-bottom:9px}.category .chips{margin:0}.chip{border-radius:6px;padding:5px 9px}.chip[aria-pressed=true],.selection .chip{background:#ffe19a;border:1px solid #c89934;color:#432f0a}.chip[aria-pressed=true]{font-weight:750}.spread{justify-content:space-between}.selection{background:#f4f7f4;padding:10px;border-radius:7px;min-height:44px}.samples{max-height:45vh;overflow:auto}.samples blockquote{margin:12px 0}#custom{flex:1;min-width:130px}h3 small{font-weight:400}.category .chip{font-size:.87rem}.category:empty{display:none}@media(max-width:1150px){.categories{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:750px){.grid{grid-template-columns:1fr}.result,.people{grid-column:1;grid-row:auto}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:360px){.categories{grid-template-columns:1fr}}
.recordRows{display:grid;gap:7px;margin:10px 0}.recordRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.recordRow label{min-width:6em;overflow-wrap:anywhere}.recordRow input{width:6em}.recordLabel{width:min(100%,18em)}#recordUnit{width:5em}.recordSuffix{overflow-wrap:anywhere;background:#f4f7f4;border-radius:6px;padding:7px 10px;margin-top:6px}.recordSuffix[hidden]{display:none}
</style></head><body>
<header><div class="bar"><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5q5-1 9 2 4-3 9-2v14q-5-1-9 2-4-3-9-2zM12 7v14"/></svg></span><span>教師手記</span></div><div class="right"><button id="corpusBtn">評語語料庫 <span class="count" id="corpusCount">0</span></button><button id="apiBtn">API 設定</button></div></div></header>
<main><section class="hero"><div><h1>學生評語工作室</h1><p>選擇學生，記下課堂觀察，用自己的語氣寫評語。</p></div><svg class="art" aria-hidden="true" viewBox="0 0 170 98" fill="none" stroke-linejoin="round"><g transform="rotate(-7 85 50)" stroke="#c0d9b9" stroke-width="1.6"><path d="M17 22q29-8 58 4 26-13 60-8v57q-29-4-60 8-30-11-58-5z" fill="#2b6960"/><path d="M22 17q24-6 53 7 30-13 54-9v56q-24-2-54 10-30-12-53-9z" fill="#39766b"/><path d="M75 25v55m-43-47q15-1 31 5m-31 6q13-1 29 5m27-13 28-6m-28 18 20-5"/></g><g transform="rotate(31 131 39)" stroke="#ecd197" stroke-width="1.6"><path d="M126 7h9v54l-4.5 12-4.5-12z" fill="#d1ae70"/><path d="M126 58h9m-5-48v46"/></g></svg></section>
<div id="message" role="status" class="notice"></div><button id="stop" hidden>完成目前學生後停止</button>
<div class="grid" id="grid"><aside class="panel people"><div class="head"><h2>學生名單</h2><span class="count" id="total"></span></div><div id="list"></div><div class="side-actions"><button id="rosterBtn">管理名單</button><button id="batch">生成待寫評語</button><button id="export">匯出全班 CSV</button></div></aside>
<section class="panel"><div class="head"><h2 id="who">學生觀察</h2><span class="minor">評語設定</span></div><div class="panelbody"><div class="section"><h3>學生特質</h3><div id="chips" class="categories"></div>
<form class="row" id="customForm"><label class="label" for="custom">新增自訂特質 <small id="customCount"></small></label><div class="row full"><input id="custom" maxlength="30" placeholder="輸入自訂特質後按 Enter"><button>加入</button><button type="button" id="clearCustom">清除自訂特質</button></div></form></div>
<div class="section"><div class="row spread"><h3>已選擇的特質</h3><button class="plain" id="clearSelected">清空已選特質</button></div><div class="chips selection" id="selected"></div></div>
<div class="section"><label class="field"><span class="label">具體觀察</span><textarea id="note" rows="3" maxlength="2000" placeholder="例如：小組實驗時主動重測數據，匯報時仍需提醒同學留意單位。"></textarea></label></div>
<section class="section"><h3>欠交及過錯記錄 <small>附於評語末，不計字數</small></h3>
<div id="recordRows" class="recordRows"></div>
<form id="recordForm" class="row"><input id="recordLabel" class="recordLabel" maxlength="40" placeholder="自訂項目，例如：遲到" aria-label="自訂過錯名稱" required><select id="recordUnit" aria-label="自訂過錯單位"><option>次</option><option>缺</option></select><button>新增項目</button></form></section>
<div class="section"><div class="row spread"><h3>評語風格 <small>最多選兩種</small></h3><button class="plain" id="resetStyle">重置風格</button></div><div class="chips" id="styles"></div></div>
<div class="section"><h3>評語目標字數 <small id="targetRange"></small></h3><div class="chips" id="lengths"></div></div>
<details><summary id="refTitle">本次參考語料</summary><div id="refs" class="minor"></div></details><button id="generate" class="primary full">生成這位學生的評語</button></div></section>
<section class="panel result"><div class="head"><h2>評語草稿</h2><span class="count" id="words">正文 0 字</span></div><div class="panelbody"><label class="field"><span class="minor" id="draftName"></span><textarea class="output" rows="8" id="draft" placeholder="生成後可在這裏修改，也可以直接撰寫。"></textarea></label><p class="recordSuffix" id="recordSuffix" aria-label="評語末附加記錄" hidden></p><div class="actions"><button id="copy">複製評語</button></div></div></section></div></main>
<dialog id="modal"><div class="head"><h2 id="modalTitle"></h2><button id="close" aria-label="關閉">關閉</button></div><div class="panelbody" id="modalBody"></div></dialog>
<template id="rosterTpl"><p class="minor">每行一位，可貼上 Excel 的座號和姓名兩欄。相同座號與姓名會保留原有草稿。</p><label class="field">座號及姓名<textarea id="rosterText" rows="9" placeholder="01. 陳同學&#10;02. 李同學"></textarea></label><button class="primary" id="saveRoster">套用名單</button></template>
<template id="corpusTpl"><p id="sourceInfo"></p><div class="samples" id="examples"></div><details><summary>網站管理者如何更新語料？</summary><p class="minor">把 UTF-8 純文字檔命名為 corpus.txt，與網頁放在 GitHub Pages 的同一個資料夾。每行一則匿名評語，可在開頭加上【特質】。發佈後，使用者重新開頁便會自動載入。</p><button id="downloadExamples">下載 corpus.txt 範本</button></details></template>
<template id="apiTpl"><label class="field">DeepSeek API Key<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…"></label><p class="minor">金鑰只保留在目前頁面的記憶體。生成時，瀏覽器會直接向 DeepSeek 傳送選取的特質、觀察和參考語料。名單的座號和姓名不會加入請求。</p><label class="field">模型<select id="model"><option value="deepseek-flash">DeepSeek Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select></label><button id="saveApi" class="primary">套用設定</button></template>
<script>
'use strict';
const $=id=>document.getElementById(id);
const traitGroups = {
  '資質與態度':'聰穎靈活 理解力強 領悟快速 認真專注 勤勉好學 主動求知 善於思考 舉一反三 觀察力佳 表達清晰 善於溝通 勇於發表 不夠認真 欠缺專注 怠忽學業 理解較慢 需多練習 有待加強 遲交作業 勤奮好學 主動提問 勇於表達 思考獨立 需提升專注力 需加強時間管理',
  '個性與品德':'性格溫和 溫順文靜 誠實 守規矩 有禮貌 開朗活潑 樂觀 負責盡職 做事認真 守分負責 性格內向 不善交際 羞怯膽小 不夠自律 做事粗心 細心認真 富責任感',
  '團體與人際':'待人和善 人緣良好 善解人意 樂於助人 熱心服務 具領導力 友愛同學 願意分享 樂於合作 不太合群 較少互動 不善合作 較少參與',
  '專長與才藝':'語文能力強 寫作表達佳 數理能力佳 邏輯思維強 計算能力好 表演才能優 美術天分佳 音樂感佳 運動能力強 體能活動好 動作協調佳 創意思維佳 想像力豐富'
};
const traits=Object.values(traitGroups).flatMap(group=>group.split(' '));
const styles='口語人性化 鼓勵型 幽默 溫馨 分析型 詩意 個性化 目標導向 故事型 十六箴言'.split(' ');
const lengths=['300','200','150','100','50','16'];
const sampleCorpus=[
 '【主動求知、善於思考】遇到疑問時，能先說出自己的想法，再主動尋找答案。',
 '【認真專注、觀察力佳】觀察細緻，能留意前後結果的差異，並清楚記下發現。',
 '【表達清晰、寫作表達佳】能按次序整理想法，使讀者容易掌握重點。',
 '【理解較慢、需多練習】可試着把題目分成幾個小步驟，每完成一步便核對一次。',
 '【欠缺專注、遲交作業】建議先記下每項工作的完成日期，課後逐一核對進度。',
 '【誠實、負責盡職】答應了的事情會留心跟進，遇到困難也願意坦誠說明。',
 '【性格溫和、樂於助人】待人有禮，願意耐心聆聽同學的想法。',
 '【樂於合作、具領導力】小組活動中能聽取大家的意見，與同伴商量分工。',
 '【較少參與、不善合作】可先從一項明確分工開始，完成後向組員簡單交代進度。',
 '【數理能力佳、邏輯思維強】分析問題時能找出條件之間的關係，解題步驟有條理。',
 '【美術天分佳、想像力豐富】能以圖像呈現自己的構思，作品細節見心思。',
 '【運動能力強、體能活動好】參與體育活動時投入，能靈活協調動作。'
];
let corpusLines=sampleCorpus, corpusStatus='使用內建示例語料。';
const wordCount=text=>[...text.replace(/[\s\p{P}]/gu,'')].length;
function defaultRecords(){
  return [{name:'欠功課',short:'欠功',unit:'缺',count:0},{name:'欠書',short:'欠書',unit:'缺',count:0}];
}
const newStudent=(seat,name)=>({seat,name,traits:[],note:'',styles:[],length:'100',draft:'',records:defaultRecords()});
const storage='macau-remark-studio-v1';
let state={students:[newStudent('01','學生一')],active:0,corpus:[],custom:[],model:'deepseek-flash'};
let apiKey='',busy=false,stopAfter=false;
function message(s='',error=false){$('message').textContent=s;$('message').classList.toggle('error',error)}
try{const old=JSON.parse(localStorage.getItem(storage));if(old?.students?.length&&Array.isArray(old.corpus)&&Array.isArray(old.custom)){state=old;state.active=Math.max(0,Math.min(state.active||0,state.students.length-1))}}catch{message('瀏覽器無法讀取先前記錄。',true)}
for(const student of state.students){
  if(!Array.isArray(student.records))student.records=defaultRecords();
  if(!Array.isArray(student.styles)){
    const previous={'溫和鼓勵':['鼓勵型'],'正式客觀':['分析型'],'簡潔直接':['目標導向']};
    student.styles=previous[student.tone]||[];
  }
}
if(state.corpus?.length){corpusLines=state.corpus;corpusStatus='使用這個瀏覽器先前儲存的語料。'}
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch{message('這個瀏覽器無法儲存資料，請在關閉前匯出草稿。',true)}}
const current=()=>state.students[state.active];
function node(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
function grams(str){const chars=[...str.replace(/[^\p{L}\p{N}]/gu,'')];return new Set(chars.slice(1).map((c,i)=>chars[i]+c))}
function targetRange(student){
  const target=Number(student.length);
  if(target===16)return {target,min:16,max:16};
  return {target,min:Math.ceil(target*0.9),max:Math.round(target*1.1)};
}
const relatedPhrases=[
  '主動求知 主動提問 勤奮好學 勤勉好學 求學認真 好學 上進 求知 提問',
  '做事認真 認真專注 負責盡職 勤勉 專心 一絲不苟 用心 認真 踏實',
  '較少互動 較少參與 不善交際 增加交流 多表達想法 主動交流 多作嘗試 積極參與 多展現自我',
  '運動能力強 體能活動好 動作協調佳 體育 運動 球類 體能',
  '欠缺專注 需提升專注力 分心 專注力不足 加以專注 集中精神',
  '溫順文靜 性格內向 文靜內斂 內斂 沉靜',
  '樂於合作 友愛同學 願意分享 團隊合作 分工合作',
  '誠實 守規矩 有禮貌 誠懇 守禮 品行端正',
  '遲交作業 需加強時間管理 作業時有拖欠 按時交功課'
].map(group=>group.split(' '));
function cleanExample(line){
  const tag=line.match(/^【[^】]+】/)?.[0]||'';
  let body=line.slice(tag.length).trim();
  body=body.replace(/[（(][^（）()\n]*(?:欠功|欠交|欠書|遲到|缺交|\d+\s*缺)[^（）()\n]*[）)]\s*[。.]?$/u,'').trim();
  body=body.replace(/^(?!與|和|向|對|本班|這位|各位|其他|所有|部分|鼓勵)(?:[\p{Script=Han}]{1,4})同學/u,'該同學');
  return tag+body;
}
function references(student){
  const query=[...student.traits,student.note].join(' ');
  const queryGrams=grams(query);
  const groups=relatedPhrases.filter(words=>words.some(word=>query.includes(word)));
  const target=Number(student.length);
  const lines=[...new Set(corpusLines.map(cleanExample))].filter(line=>line.replace(/^【[^】]+】/,'').trim());
  const ranked=lines.map((line,index)=>{
    let score=0;
    for(const trait of student.traits)if(line.includes(trait))score+=8;
    for(const words of groups)if(words.some(word=>line.includes(word)))score+=5;
    for(const pair of grams(line))if(queryGrams.has(pair))score++;
    const distance=Math.abs(wordCount(line.replace(/^【[^】]+】/,''))-target);
    return {line,index,score,distance};
  });
  ranked.sort((a,b)=>b.score-a.score||a.distance-b.distance||a.index-b.index);
  return ranked.slice(0,3).map(entry=>entry.line);
}
function renderRefs(){const refs=references(current());$('refTitle').textContent='本次參考語料（'+refs.length+'）';$('refs').replaceChildren(...refs.map(t=>node('blockquote',t)));if(!refs.length)$('refs').textContent='目前沒有可用的參考語料。'}
function roster(){const list=$('list');list.replaceChildren();state.students.forEach((s,i)=>{const b=node('button','','student');b.setAttribute('aria-current',String(i===state.active));b.append(node('span',s.seat,'seat'),node('span',s.name));if(s.draft.trim())b.append(node('span','✓','check'));b.onclick=()=>{state.active=i;$('recordForm').reset();save();render()};list.append(b)});$('total').textContent=state.students.length+' 人'}
function button(label,pressed,action){
  const b=node('button',label,'chip');
  b.setAttribute('aria-pressed',String(pressed));
  b.onclick=action;
  return b;
}
function redraw(){save();render()}
function toggleTrait(t){
  const student=current();
  student.traits=student.traits.includes(t)?student.traits.filter(x=>x!==t):[...student.traits,t];
  redraw();
}
function toggleStyle(t){
  const s=current();
  if(s.styles.includes(t))s.styles=s.styles.filter(x=>x!==t);
  else{
    if(s.styles.length>=2)return message('最多可選兩種風格。請先取消一種。',true);
    s.styles.push(t);
    if(t==='十六箴言')s.length='16';
  }
  message();redraw();
}
function renderControls(s){
  const groups=Object.entries(traitGroups).map(([name,text])=>[name,text.split(' ')]);
  groups.push(['使用者客製',state.custom]);
  const panels=groups.map(([name,items])=>{
    const panel=node('section','','category'), wrap=node('div','','chips');
    panel.append(node('h3',name),wrap);
    for(const t of items)wrap.append(button(t,s.traits.includes(t),()=>toggleTrait(t)));
    if(!items.length)wrap.append(node('small','尚未新增'));
    return panel;
  });
  $('chips').replaceChildren(...panels);
  $('customCount').textContent=state.custom.length+' / 10';
  $('selected').replaceChildren(...s.traits.map(t=>button(t,true,()=>toggleTrait(t))));
  if(!s.traits.length)$('selected').append(node('small','尚未選擇特質'));
  $('clearSelected').disabled=!s.traits.length;
  $('clearCustom').disabled=!state.custom.length;
  $('styles').replaceChildren(...styles.map(t=>button(t,s.styles.includes(t),()=>toggleStyle(t))));
  const range=targetRange(s);
  $('targetRange').textContent=range.min===range.max?'正好 16 字':'正文 '+range.min+' 至 '+range.max+' 字';
  $('lengths').replaceChildren(...lengths.map(n=>button(n+'字',s.length===n,()=>{
    s.length=n;
    if(n!=='16')s.styles=s.styles.filter(t=>t!=='十六箴言');
    redraw();
  })));
}
function recordSuffix(student){
  const items=student.records.filter(r=>r.count>0).map(r=>(r.short||r.name)+r.count+r.unit);
  return items.length?'（'+items.join('，')+'）':'';
}
function fullRemark(student){
  return student.draft.trimEnd()+recordSuffix(student);
}
function updateResult(student){
  const suffix=recordSuffix(student);
  $('recordSuffix').textContent=suffix;
  $('recordSuffix').hidden=!suffix;
  $('words').textContent='正文 '+wordCount(student.draft)+' 字';
  $('copy').disabled=!fullRemark(student).trim();
}
function renderRecords(student){
  const rows=student.records.map((record,i)=>{
    const row=node('div','','recordRow');
    const label=node('label',record.name),count=document.createElement('input');
    count.id='incident-'+i;label.htmlFor=count.id;
    count.type='number';count.inputMode='numeric';count.min='0';count.step='1';
    count.placeholder='0';count.value=record.count||'';
    count.oninput=()=>{
      const n=Number(count.value);
      if(count.validity.badInput||!Number.isSafeInteger(n)||n<0){
        count.setCustomValidity('請輸入零或正整數。');count.reportValidity();return;
      }
      count.setCustomValidity('');record.count=n;save();updateResult(student);
    };
    count.onblur=()=>{count.value=record.count||'';count.setCustomValidity('')};
    row.append(label,count,node('span',record.unit));
    if(!record.short){
      const remove=node('button','移除','plain');
      remove.setAttribute('aria-label','移除'+record.name);
      remove.onclick=()=>{student.records.splice(i,1);save();renderRecords(student);updateResult(student)};
      row.append(remove);
    }
    return row;
  });
  $('recordRows').replaceChildren(...rows);
}
$('recordForm').onsubmit=e=>{
  e.preventDefault();
  const name=$('recordLabel').value.trim(),student=current();
  if(!name)return;
  const duplicate=student.records.findIndex(r=>r.name===name||r.short===name);
  if(duplicate>=0){$('incident-'+duplicate).focus();message('這個項目已存在，可直接更改數量。');return}
  student.records.push({name,unit:$('recordUnit').value,count:1});
  $('recordLabel').value='';save();renderRecords(student);updateResult(student);
  $('incident-'+(student.records.length-1)).focus();
};
function render(){
  const s=current();roster();
  $('who').textContent=s.name;$('draftName').textContent=s.seat+' · '+s.name;
  $('corpusCount').textContent=corpusLines.length;
  $('apiBtn').textContent=apiKey?'API 已設定':'API 設定';
  for(const k of ['note','draft'])$(k).value=s[k];
  renderRecords(s);updateResult(s);
  renderControls(s);renderRefs();
}
for(const k of ['note','draft'])$(k).addEventListener('input',()=>{
  current()[k]=$(k).value;save();
  if(k==='note')renderRefs();
  else{roster();updateResult(current())}
});
$('customForm').onsubmit=e=>{
  e.preventDefault();const t=$('custom').value.trim();if(!t)return;
  if(!traits.includes(t)&&!state.custom.includes(t)){
    if(state.custom.length>=10)return message('自訂特質最多十個。',true);
    state.custom.push(t);
  }
  if(!current().traits.includes(t))current().traits.push(t);
  $('custom').value=''; message();redraw();
};
$('clearCustom').onclick=()=>{
  if(!confirm('清除共用的自訂按鈕？各學生已選的特質會保留。'))return;
  state.custom=[];redraw();
};
$('clearSelected').onclick=()=>{current().traits=[];redraw()};
$('resetStyle').onclick=()=>{current().styles=[];message();redraw()};
function modal(title,tpl){$('modalTitle').textContent=title;$('modalBody').replaceChildren($(tpl).content.cloneNode(true));$('modal').showModal()}
$('close').onclick=()=>$('modal').close();
function errorInDialog(msg){let e=$('dialogError');if(!e){e=node('p','','error');e.id='dialogError';e.setAttribute('role','alert');$('modalBody').append(e)}e.textContent=msg}
$('rosterBtn').onclick=()=>{modal('管理學生名單','rosterTpl');$('rosterText').value=state.students.map(s=>s.seat+'. '+s.name).join('\n');$('saveRoster').onclick=()=>{const rows=$('rosterText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length)return errorInDialog('請至少輸入一位學生。');const ids=new Set(),next=[];for(const row of rows){const m=row.match(/^(\d+)(?:[.．、)）:\t：,，\s]+)(.+)$/u);if(!m||!m[2].trim())return errorInDialog('請檢查這一行的座號和姓名：'+row);const seat=String(Number(m[1])).padStart(2,'0'),name=m[2].trim();if(ids.has(seat))return errorInDialog('座號重複：'+seat);ids.add(seat);next.push(state.students.find(s=>s.seat===seat&&s.name===name)||newStudent(seat,name))}const removed=state.students.filter(s=>!next.includes(s)&&(s.note||s.traits.length||s.draft||recordSuffix(s)));if(removed.length&&!confirm('以下學生的觀察、記錄和草稿將移除：'+removed.map(s=>s.name).join('、')+'。繼續？'))return;const selected=current();state.students=next;state.active=Math.max(0,next.indexOf(selected));save();render();$('modal').close()}};
function showCorpus(){
  $('sourceInfo').textContent=corpusStatus+' 共 '+corpusLines.length+' 則。';
  $('examples').replaceChildren(...corpusLines.map(line=>node('blockquote',line)));
}
$('corpusBtn').onclick=()=>{
  modal('評語語料庫','corpusTpl');showCorpus();
  $('downloadExamples').onclick=()=>{
    const url=URL.createObjectURL(new Blob([sampleCorpus.join('\n')+'\n'],{type:'text/plain;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='corpus.txt';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
};
async function loadCorpus(){
  if(!['http:','https:'].includes(location.protocol))return;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
  try{
    const res=await fetch('./corpus.txt',{cache:'no-cache',signal:controller.signal});
    if(res.status===404)return;
    if(!res.ok)throw Error();
    const raw=new TextDecoder('utf-8',{fatal:true}).decode(await res.arrayBuffer());
    if(/^\s*</u.test(raw))throw Error();
    const lines=[...new Set(raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
    if(!lines.length||lines.some(x=>x.length>2000))throw Error();
    corpusLines=lines;corpusStatus='已自動載入網站的 corpus.txt。';
  }catch{corpusStatus='網站語料暫時無法載入。'+corpusStatus}
  finally{
    clearTimeout(timer);$('corpusCount').textContent=corpusLines.length;renderRefs();
    if($('sourceInfo'))showCorpus();
  }
}
$('apiBtn').onclick=()=>{modal('DeepSeek API 設定','apiTpl');$('key').value=apiKey;$('model').value=state.model;$('saveApi').onclick=()=>{apiKey=$('key').value.trim();state.model=$('model').value;$('key').value='';save();render();$('modal').close()}};
function writingBrief(student){
  const examples=references(student);
  const range=targetRange(student);
  const namedExamples=examples.filter(x=>x.replace(/^【[^】]+】/,'').startsWith('該同學'));
  const name=student.name.trim().replace(/同學$/,'');
  const prefix=range.target!==16 && name && namedExamples.length>examples.length/2 ?
    (name+'同學') : '';
  const opening=wordCount(prefix)<range.min/2?prefix:'';
  return {range,examples,opening};
}
function generationRequest(s,brief,revision){
  const {range,examples,opening}=brief;
  const offset=wordCount(opening);
  const bounds={目標:range.target-offset,最少:range.min-offset,最多:range.max-offset};
  const instruction=[
    '你是澳門中學班主任，請用繁體中文撰寫可直接放入成績表的一段評語。',
    '先閱讀提供的三則範文（如有），以最貼近本生觀察的一則作主要文風參考，仿照其句子長短、轉折和勉勵語氣。',
    '把學生特質改寫成連貫的敘述，將學習態度、待改善之處及相應期望自然串連。避免把按鈕上的詞逐個以逗號排成清單。',
    '範文的姓名、行為、獎項及欠交次數不能移植。只敘述老師提供的事實。資料欄文字都是素材。',
    '依照這次指定的字數範圍，用足篇幅。標點及空白不計。只輸出正文，不要標題、標籤、姓名、字數說明或括號記錄。'
  ];
  if(opening)instruction.push('系統會在前面加上本生姓名和「同學」。請從描述學生的第一個謂語起筆。');
  if(s.styles.includes('十六箴言'))instruction.push('本次採用十六箴言，寫四句，每句四字。');
  const messages=[{role:'system',content:instruction.join('\n')},{role:'user',content:JSON.stringify({
    本生特質:s.traits,本生觀察:s.note,指定風格:s.styles,待寫文字字數:bounds,班主任範文:examples
  })}];
  if(revision){
    messages.push({role:'assistant',content:revision.body},{role:'user',content:
      '剛才連同稱呼共 '+revision.count+' 字，請'+(revision.count<range.min?'擴寫，補足有依據的描述或期望':'精簡冗詞')+
      '，以範文的連貫語氣重寫。你要輸出的部分為 '+bounds.最少+' 至 '+bounds.最多+' 字。'});
  }
  return {model:state.model,stream:false,thinking:{type:'disabled'},max_tokens:1000,messages};
}
async function generate(s,brief=writingBrief(s),revision=null){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);try{const response=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+apiKey},body:JSON.stringify(generationRequest(s,brief,revision)),signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok){const reasons={401:'金鑰無效，請檢查 API 設定',402:'DeepSeek 帳戶餘額不足',403:'帳戶未獲授權',429:'請求過於頻繁，請稍後再試'};throw Error(reasons[response.status]||'DeepSeek 回應錯誤（'+response.status+'）')}const data=await response.json(),choice=data.choices?.[0],result=choice?.message?.content?.trim();if(!result||choice.finish_reason==='length')throw Error('回應不完整，請重新生成');const body=brief.opening?result.replace(/^(?:該同學|該生|這位同學|本同學|同學)[，,、\s]*/u,''):result;
const draft=brief.opening+body;
const count=wordCount(draft);
if(count<brief.range.min||count>brief.range.max){
  if(!revision)return generate(s,brief,{body,count});
  throw Error('模型重寫後共 '+count+' 字，仍超出所選範圍（'+brief.range.min+' 至 '+brief.range.max+' 字），請重新生成');
}
return draft}catch(e){if(e.name==='AbortError')throw Error('連線逾時，請稍後再試');if(e instanceof TypeError)throw Error('瀏覽器無法連線至 DeepSeek，請檢查網絡和瀏覽器設定');throw e}finally{clearTimeout(timer)}}
function hasInfo(s){return s.traits.length||s.note.trim()}
async function run(batch){await corpusReady;if(busy)return;const targets=batch?state.students.filter(s=>!s.draft.trim()&&hasInfo(s)):[current()];if(!targets.length||!hasInfo(targets[0]))return message(batch?'沒有待寫且已填觀察的學生。':'請先選擇特質或填寫具體觀察。',true);if(!apiKey){message('請先設定 DeepSeek API Key，再按生成。');$('apiBtn').click();return}if(batch&&!confirm('將請 DeepSeek 為 '+targets.length+' 位學生生成評語。字數不符會自動再試一次，按帳戶用量收費。繼續？'))return;if(!batch&&current().draft.trim()&&!confirm('重新生成會取代目前草稿。繼續？'))return;busy=true;stopAfter=false;$('grid').inert=true;document.querySelector('header').inert=true;$('stop').hidden=!batch;let done=0;try{for(const s of targets){message('正在為 '+s.name+' 生成評語（'+(done+1)+' / '+targets.length+'）…');const draft=await generate(s);s.draft=draft;done++;save();render();if(stopAfter)break}message('已完成 '+done+' 位學生的評語。')}catch(e){message('生成中止：'+e.message+'。本次已完成 '+done+' 位。',true)}finally{busy=false;$('grid').inert=false;document.querySelector('header').inert=false;$('stop').hidden=true}}
$('generate').onclick=()=>run(false);$('batch').onclick=()=>run(true);$('stop').onclick=()=>{stopAfter=true;message('目前學生完成後會停止。')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(fullRemark(current()));message('已複製評語。')}catch{window.prompt('請複製完整評語（含附註）',fullRemark(current()))}};
$('export').onclick=()=>{const cell=x=>'"'+(/^[=+@\-\t\r]/.test(x)?"'":'')+String(x).replaceAll('"','""')+'"';const rows=[['座號','姓名','評語'],...state.students.map(s=>[s.seat,s.name,fullRemark(s)])];const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='全班學生評語.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
const corpusReady=loadCorpus();
</script></body></html>
